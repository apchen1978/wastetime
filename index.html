<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0d12" />
<title>浪費時間 | 一個認真浪費時間的遊戲</title>
<style>
  /* ============================================================
     浪費時間 (Waste Time) v0.2 | 點擊/放置小遊戲
     重建自遺失的 Gemini + Project IDX 專案（2026-08-19）
     v0.2 遊戲爽度升級：Q彈擠壓 / 霓虹漣漪 / CPS 聯動指針 /
     數字彈跳 / WebAudio 晶片音 / 摸魚狂熱事件
     Design: 暗色科技座艙 | 單一 accent 酸綠 #a8e63c
     Radius 規則: 面板 12px、按鈕全圓形(pill)、晶片 6px
     ============================================================ */

  :root {
    --bg:        #0a0d12;
    --panel:     #11161d;
    --panel-2:   #161d26;
    --line:      #222c3a;
    --line-soft: #1a2230;
    --text:      #e6edf3;
    --dim:       #8b98a5;
    --accent:    #a8e63c;
    --accent-ink:#0a0d12;
    --gold:      #ffc857;
    --danger:    #ff5d5d;
    --r-panel: 12px;
    --r-chip:  6px;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "Microsoft JhengHei", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(168, 230, 60, 0.06), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(168, 230, 60, 0.04), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sans);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 微格線背景 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 40%, transparent 100%);
  }

  /* 狂熱模式：外框金光閃爍 */
  body.frenzy::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 70;
    border: 3px solid rgba(255, 199, 87, 0.05);
    animation: goldFlash 0.9s ease-in-out infinite;
  }
  @keyframes goldFlash {
    0%, 100% { border-color: rgba(255,199,87,0.06); box-shadow: inset 0 0 30px rgba(255,199,87,0.05); }
    50%      { border-color: rgba(255,199,87,0.9);  box-shadow: inset 0 0 90px rgba(255,199,87,0.30); }
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(14px, 3vw, 28px);
    position: relative;
    z-index: 1;
  }

  /* ---------- 頂欄 ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .brand h1 {
    font-size: clamp(20px, 4vw, 28px);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .brand .tagline {
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .head-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: scale(0.96); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* ---------- 主版面 ---------- */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr);
    gap: 18px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-panel);
    padding: 18px;
  }
  .panel h2 {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .panel h2 .dot { color: var(--accent); }

  /* ---------- 左：時間水槽 ---------- */
  .sink {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: clamp(20px, 4vw, 36px) 18px;
  }

  .clock-btn {
    position: relative;
    width: clamp(180px, 40vw, 250px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--line);
    background:
      radial-gradient(circle at 32% 28%, #1a2330, #0e131b 70%);
    cursor: pointer;
    transition: transform 0.06s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    overflow: visible;
  }
  .clock-btn:hover { border-color: var(--accent); }
  .clock-btn:active { transform: scale(0.955); }
  .clock-btn.hot {
    box-shadow: 0 0 0 6px rgba(168, 230, 60, 0.10), 0 0 42px rgba(168, 230, 60, 0.22);
  }
  body.frenzy .clock-btn.hot {
    box-shadow: 0 0 0 6px rgba(255,199,87,0.12), 0 0 46px rgba(255,199,87,0.30);
  }

  /* Q 彈擠壓 */
  .clock-btn.squash { animation: squash 0.34s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes squash {
    0%   { transform: scale(1, 1); }
    18%  { transform: scale(1.16, 0.86); }
    45%  { transform: scale(0.92, 1.08); }
    70%  { transform: scale(1.05, 0.96); }
    100% { transform: scale(1, 1); }
  }

  .clock-btn svg { position: absolute; inset: 9%; width: 82%; height: 82%; pointer-events: none; }
  #hands { transition: filter 0.3s ease; transform-origin: 50px 50px; }
  #hands.fast { filter: blur(0.7px); }
  #hands.blur { filter: blur(2.2px); }

  .clock-btn .label {
    position: absolute;
    left: 0; right: 0; bottom: 16%;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--dim);
    pointer-events: none;
    z-index: 3;
  }

  /* 點擊漣漪 */
  .floaties { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2.5px solid rgba(168, 230, 60, 0.85);
    box-shadow: 0 0 18px rgba(168, 230, 60, 0.45), inset 0 0 12px rgba(168, 230, 60, 0.2);
    pointer-events: none;
    animation: rippleOut 0.55s ease-out forwards;
    z-index: 4;
  }
  body.frenzy .ripple { border-color: rgba(255,199,87,0.9); box-shadow: 0 0 18px rgba(255,199,87,0.5), inset 0 0 12px rgba(255,199,87,0.25); }
  @keyframes rippleOut {
    0%   { transform: translate(-50%, -50%) scale(0.15); opacity: 0.95; }
    100% { transform: translate(-50%, -50%) scale(1.9); opacity: 0; }
  }

  /* 點擊飄字（隨機角度與位移） */
  .floaty {
    position: absolute;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 10px rgba(168,230,60,0.55);
    --dx: 0px;
    --rot: 0deg;
    --drop: 78px;
    animation: floatUp 0.85s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    left: 50%;
    top: 40%;
    z-index: 5;
    pointer-events: none;
  }
  body.frenzy .floaty { color: var(--gold); text-shadow: 0 0 10px rgba(255,199,87,0.6); }
  @keyframes floatUp {
    0%   { transform: translate(-50%, 0) rotate(0deg) scale(0.55); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-1 * var(--drop))) rotate(var(--rot)) scale(1.18); opacity: 0; }
  }

  .readout { text-align: center; }
  .readout .total {
    display: inline-block;
    font-family: var(--mono);
    font-size: clamp(30px, 6vw, 46px);
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(168, 230, 60, 0.25);
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    transform-origin: 50% 60%;
  }
  .readout .total small { font-size: 0.5em; color: var(--text); font-weight: 600; }
  .readout .total.tick { animation: tickPop 0.22s ease-out; }
  .readout .total.bigpop { animation: bigPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  body.frenzy .readout .total { color: var(--gold); text-shadow: 0 0 18px rgba(255,199,87,0.3); }
  @keyframes tickPop { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes bigPop  { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }

  .readout .meta {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .readout .meta b { color: var(--accent); font-weight: 600; }
  body.frenzy .readout .meta b { color: var(--gold); }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: var(--r-chip);
    padding: 5px 10px;
    background: var(--panel-2);
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip .accent { color: var(--accent); }

  /* ---------- 右：升級與統計 ---------- */
  .controls { display: flex; flex-direction: column; gap: 14px; }

  .gen-list { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
  .gen-list::-webkit-scrollbar { width: 6px; }
  .gen-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .gen {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line-soft);
    border-radius: var(--r-chip);
    background: var(--panel-2);
    transition: border-color 0.15s ease, transform 0.08s ease;
  }
  .gen:hover { border-color: var(--line); }
  .gen .g-main { min-width: 0; }
  .gen .g-name {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 14px; font-weight: 600;
  }
  .gen .g-name .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .gen .g-name .count.hot { color: var(--accent); border-color: var(--accent); }
  .gen .g-desc {
    margin-top: 2px;
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gen .g-rate {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  body.frenzy .gen .g-rate { color: var(--gold); }

  .buy {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.07s ease, filter 0.12s ease;
    font-variant-numeric: tabular-nums;
  }
  .buy:hover { filter: brightness(1.08); }
  .buy:active { transform: scale(0.93); }
  .buy:disabled {
    background: #232c38;
    color: #5c6a78;
    cursor: not-allowed;
    filter: none;
  }
  .buy.flash { animation: buyFlash 0.3s ease-out; }
  @keyframes buyFlash { 0% { transform: scale(1.18); filter: brightness(1.3); } 100% { transform: scale(1); } }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    border: 1px solid var(--line-soft);
    border-radius: var(--r-chip);
    padding: 10px;
    background: var(--panel-2);
  }
  .stat .k {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.05em;
  }
  .stat .v {
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat .v.accent { color: var(--accent); }
  body.frenzy .stat .v.accent { color: var(--gold); }

  /* ---------- 成就記錄 ---------- */
  .log-panel { margin-top: 18px; }
  .log-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .log-item {
    display: flex; gap: 10px; align-items: baseline;
    font-size: 12.5px;
    color: var(--dim);
    border-left: 2px solid var(--line);
    padding: 5px 0 5px 10px;
    animation: logIn 0.25s ease-out;
  }
  .log-item .t {
    font-family: var(--mono);
    font-size: 10.5px;
    color: #55636f;
    flex-shrink: 0;
  }
  .log-item.ach { color: var(--text); border-left-color: var(--accent); }
  .log-item.ach .t { color: var(--accent); }
  @keyframes logIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ---------- 里程碑橫幅 ---------- */
  .banner {
    position: fixed;
    top: 18px; left: 50%;
    transform: translate(-50%, -140%);
    z-index: 80;
    display: flex; flex-direction: column; gap: 4px; align-items: center;
    padding: 14px 26px;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    border-radius: var(--r-panel);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 24px rgba(168,230,60,0.15);
    text-align: center;
    max-width: min(420px, 90vw);
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.2);
    pointer-events: none;
  }
  .banner.show { transform: translate(-50%, 0); }
  .banner .b-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--accent);
  }
  .banner .b-msg { font-size: 14px; color: var(--text); }
  .banner.gold { border-color: var(--gold); box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 24px rgba(255,199,87,0.25); }
  .banner.gold .b-title { color: var(--gold); }

  /* ---------- 狂熱計時 ---------- */
  .frenzy-chip {
    position: fixed;
    top: 76px; right: 16px;
    z-index: 75;
    display: none;
    align-items: center; gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #1a1405;
    background: var(--gold);
    border-radius: 999px;
    padding: 8px 16px;
    box-shadow: 0 0 22px rgba(255,199,87,0.55);
    animation: chipPulse 0.6s ease-in-out infinite;
    white-space: nowrap;
  }
  .frenzy-chip.show { display: flex; }
  @keyframes chipPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ---------- 摸魚氣泡 ---------- */
  .slack-bubble {
    position: fixed;
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    padding: 12px 18px;
    border-radius: 999px;
    background: linear-gradient(140deg, rgba(255,199,87,0.16), rgba(168,230,60,0.10));
    border: 1.5px solid rgba(255,199,87,0.65);
    box-shadow: 0 0 26px rgba(255,199,87,0.28), inset 0 0 14px rgba(255,199,87,0.10);
    animation: bubbleFloat 2.6s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.4s ease, transform 0.15s ease;
    user-select: none;
  }
  .slack-bubble:hover { transform: scale(1.06); }
  .slack-bubble .b-orb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9b0, var(--gold) 60%, #d99a1f);
    box-shadow: 0 0 14px rgba(255,199,87,0.8);
    animation: orbGlow 1.6s ease-in-out infinite;
  }
  @keyframes orbGlow { 0%, 100% { box-shadow: 0 0 10px rgba(255,199,87,0.6); } 50% { box-shadow: 0 0 22px rgba(255,199,87,1); } }
  .slack-bubble .b-label {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.1em;
  }
  .slack-bubble .b-hint {
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  @keyframes bubbleFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }
  .slack-bubble.dying { opacity: 0; transform: scale(0.7); }

  /* ---------- 重置確認 ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5, 8, 12, 0.72);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 90;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    width: min(360px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-panel);
    padding: 22px;
  }
  .modal h3 { font-size: 16px; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--dim); line-height: 1.6; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn.solid {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .btn.solid:hover { color: var(--accent-ink); }
  .btn.solid-danger { background: var(--danger); color: #16090b; border-color: var(--danger); }
  .btn.solid-danger:hover { color: #16090b; }

  footer {
    margin-top: 26px;
    text-align: center;
    font-size: 12px;
    color: #4d5a66;
    letter-spacing: 0.04em;
  }

  /* ---------- 行動版 ---------- */
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; }
    .controls { order: 2; }
    .sink { order: 1; }
    .gen-list { max-height: 300px; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .frenzy-chip { top: auto; bottom: 18px; right: 12px; }
  }

  /* ---------- 減少動態 ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>浪費時間</h1>
      <span class="tagline">一個認真浪費時間的遊戲</span>
    </div>
    <div class="head-actions">
      <button class="btn" id="soundBtn" type="button">音效：開</button>
      <button class="btn danger" id="resetBtn" type="button">重置進度</button>
    </div>
  </header>

  <main>
    <!-- 左：時間水槽 -->
    <section class="panel sink">
      <button class="clock-btn" id="clockBtn" type="button" aria-label="浪費一秒">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#222c3a" stroke-width="2.5"/>
          <g stroke="#2c3a4d" stroke-width="3">
            <line x1="50" y1="7"  x2="50" y2="12.5" />
            <line x1="50" y1="87.5" x2="50" y2="93" />
            <line x1="7"  y1="50" x2="12.5" y2="50" />
            <line x1="87.5" y1="50" x2="93" y2="50" />
            <line x1="19.6" y1="19.6" x2="23.5" y2="23.5" />
            <line x1="80.4" y1="19.6" x2="76.5" y2="23.5" />
            <line x1="19.6" y1="80.4" x2="23.5" y2="76.5" />
            <line x1="80.4" y1="80.4" x2="76.5" y2="76.5" />
          </g>

<script>
(function () {
  "use strict";

  /* ================= 資料 ================= */
  var SAVE_KEY = "wastetime.save.v1";

  var GENERATORS = [
    { id: "daze",   name: "發呆",        desc: "什麼都不做，時間就過去了",  base: 15,  rate: 1 },
    { id: "phone",  name: "滑手機",      desc: "不知不覺就兩小時",          base: 120, rate: 5 },
    { id: "binge",  name: "追劇",        desc: "再看一集就好",              base: 700, rate: 20 },
    { id: "traffic",name: "通勤塞車",    desc: "卡在路上，動彈不得",        base: 3600, rate: 60 },
    { id: "meeting",name: "無意義會議",  desc: "每週例行，與你無關",        base: 18000, rate: 240 },
    { id: "night",  name: "熬夜修仙",    desc: "天亮再說",                  base: 90000, rate: 1000 },
    { id: "shorts", name: "刷短影音",    desc: "最後一個就好",              base: 420000, rate: 5000 },
    { id: "surf",   name: "網路閒逛",    desc: "我只是查個東西",            base: 2000000, rate: 20000 },
    { id: "daze2",  name: "人生迷惘",    desc: "我在思考人生的意義",        base: 10000000, rate: 100000 },
    { id: "hole",   name: "時間黑洞",    desc: "連光都逃不出來",            base: 50000000, rate: 1000000 }
  ];

  var CLICK_MULT_BASE = 50;
  var CLICK_MULT_GROW = 2.6;
  var FRENZY_MULT = 7;
  var FRENZY_DUR = 5000;      // 5 秒
  var SLACK_FIRST_MIN = 15000;  // 首次摸魚氣泡
  var SLACK_FIRST_MAX = 25000;
  var SLACK_MIN = 40000;        // 之後的間隔
  var SLACK_MAX = 80000;
  var SLACK_TTL = 12000;        // 氣泡存活時間

  var ACHIEVEMENTS = [
    { id: "t1m",   cond: "time",   target: 60,          title: "浪費 1 分鐘", msg: "一分鐘過去了。你不會想把它要回來的，對吧？" },
    { id: "t1h",   cond: "time",   target: 3600,        title: "浪費 1 小時", msg: "一小時過去了。這下真的回不來了。" },
    { id: "t1d",   cond: "time",   target: 86400,       title: "浪費 1 天",   msg: "一天過去了。你獲得了……空虛。" },
    { id: "t1w",   cond: "time",   target: 604800,      title: "浪費 1 週",   msg: "一週過去了。你的朋友開始擔心你了。" },
    { id: "t1mo",  cond: "time",   target: 2628000,     title: "浪費 1 月",   msg: "一個月過去了。時間成了你的藝術品。" },
    { id: "t1y",   cond: "time",   target: 31536000,    title: "浪費 1 年",   msg: "一年過去了。歡迎成為時間藝術家。" },
    { id: "c100",  cond: "clicks", target: 100,         title: "指尖大師",     msg: "點擊一百次。手指很有毅力。" },
    { id: "c1k",   cond: "clicks", target: 1000,        title: "點擊狂人",     msg: "一千次點擊。鍵盤開始冒煙。" },
    { id: "c10k",  cond: "clicks", target: 10000,       title: "人類點擊器",   msg: "一萬次。你已與滑鼠合一。" },
    { id: "g5",    cond: "gens",   target: 5,           title: "菜鳥時間藝術家", msg: "擁有五種浪費器。萬丈高樓平地起。" },
    { id: "g10",   cond: "gens",   target: 10,          title: "時間魔王",     msg: "十種浪費器全開。時間在你面前低頭。" },
    { id: "rate",  cond: "rate",   target: 100000,      title: "時間本身",     msg: "每秒十萬秒。你已經不是人類了。" },
    { id: "play",  cond: "session",target: 600,         title: "真愛無敵",     msg: "連續玩十分鐘。這遊戲才是你的本命。" },
    { id: "slack1",cond: "slack",  target: 1,           title: "摸魚王",       msg: "你抓住了一次靈光一閃。沒白摸。" },
    { id: "fr5",   cond: "frenzy", target: 5,           title: "狂熱常客",     msg: "觸發五次狂熱。時間被你玩弄於股掌之間。" }
  ];

  /* ================= 狀態 ================= */
  var state = {
    total: 0,
    clicks: 0,
    gens: GENERATORS.map(function () { return 0; }),
    clickMult: 0,
    ach: {},
    sound: true,
    slack: 0,
    frenzies: 0,
    ts: Date.now()
  };

  var frenzy = null;          // { endAt } 或 null
  var sessionStart = Date.now();
  var lastTick = Date.now();
  var bannerTimer = null;
  var bannerQueue = [];
  var slackTimer = null;
  var slackBubble = null;
  var slackTtlTimer = null;
  var audioCtx = null;

  /* ================= DOM ================= */
  var $ = function (id) { return document.getElementById(id); };
  var totalEl = $("totalReadout"), rateEl = $("rateReadout"), clickEl = $("clickReadout");
  var chipClicks = $("chipClicks"), chipGens = $("chipGens"), chipAch = $("chipAch"), chipAchTotal = $("chipAchTotal");
  var statSession = $("statSession"), statClicks = $("statClicks"), statRate = $("statRate");
  var genListEl = $("genList"), logListEl = $("logList"), floatiesEl = $("floaties");
  var clockBtn = $("clockBtn"), soundBtn = $("soundBtn"), resetBtn = $("resetBtn");
  var overlay = $("overlay");
  var banner = $("banner"), bannerTitle = $("bannerTitle"), bannerMsg = $("bannerMsg");
  var frenzyChip = $("frenzyChip"), frenzyCount = $("frenzyCount");
  var hands = $("hands"), secHand = $("secHand"), minHand = $("minHand"), hourHand = $("hourHand");

  chipAchTotal.textContent = ACHIEVEMENTS.length;

  /* ================= 工具 ================= */
  function humanize(sec) {
    sec = Math.max(0, sec);
    var units = [
      [31536000, "年"], [2628000, "月"], [604800, "週"], [86400, "天"],
      [3600, "小時"], [60, "分鐘"], [1, "秒"]
    ];
    for (var i = 0; i < units.length; i++) {
      if (sec >= units[i][0]) {
        var v = sec / units[i][0];
        var digits = v >= 100 ? 0 : (v >= 10 ? 1 : 2);
        if (units[i][0] === 1) return Math.floor(v) + " 秒";
        return v.toFixed(digits) + " " + units[i][1];
      }
    }
    return "0 秒";
  }

  function fmtCost(n) {
    if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + " 億";
    if (n >= 1e4) return (n / 1e4).toFixed(1).replace(/\.0$/, "") + " 萬";
    return Math.ceil(n).toLocaleString("zh-Hant");
  }

  function fmtGain(n) {
    return "+" + Math.round(n).toLocaleString("zh-Hant") + "s";
  }

  function rand(min, max) { return min + Math.random() * (max - min); }

  function genCost(idx) {
    return Math.ceil(GENERATORS[idx].base * Math.pow(1.15, state.gens[idx]));
  }
  function clickMultCost() {
    return Math.ceil(CLICK_MULT_BASE * Math.pow(CLICK_MULT_GROW, state.clickMult));
  }
  function baseRate() {
    var r = 0;
    for (var i = 0; i < GENERATORS.length; i++) r += GENERATORS[i].rate * state.gens[i];
    return r;
  }
  function frenzyMult() {
    return frenzy && Date.now() < frenzy.endAt ? FRENZY_MULT : 1;
  }
  function totalRate() { return baseRate() * frenzyMult(); }
  function clickPower() { return Math.pow(2, state.clickMult) * frenzyMult(); }
  function gensOwned() {
    var c = 0;
    for (var i = 0; i < state.gens.length; i++) if (state.gens[i] > 0) c++;
    return c;
  }

  /* ================= WebAudio ================= */
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!state.sound || !audioCtx) return;
    try {
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ignore audio errors */ }
  }
  function noise(dur, vol, delay, hpFreq) {
    if (!state.sound || !audioCtx) return;
    try {
      var t = audioCtx.currentTime + (delay || 0);
      var len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var f = audioCtx.createBiquadFilter();
      f.type = "highpass"; f.frequency.value = hpFreq || 2500;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(audioCtx.destination);
      src.start(t);
    } catch (e) { /* ignore */ }
  }

  /* 清脆機械滴答 */
  function sfxTick() {
    var p = rand(0.85, 1.15);
    tone(1900 * p, 0.035, "square", 0.05);
    tone(2850 * p, 0.018, "sine", 0.04, 0.002);
    noise(0.012, 0.05, 0, 4000);
  }
  /* 購買：上升兩音 */
  function sfxBuy() {
    tone(523.25, 0.07, "square", 0.05);
    tone(659.25, 0.07, "square", 0.05, 0.06);
    tone(783.99, 0.1, "triangle", 0.045, 0.12);
  }
  /* 成就：上升音階 */
  function sfxAch() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < notes.length; i++) {
      tone(notes[i], 0.14, "triangle", 0.055, i * 0.11);
    }
    noise(0.25, 0.025, 0.33, 6000);
  }
  /* 摸魚出現：輕柔提示 */
  function sfxSlack() {
    tone(987.77, 0.08, "sine", 0.045);
    tone(1318.51, 0.12, "sine", 0.04, 0.07);
  }
  /* 狂熱啟動：金黃上升掃頻 */
  function sfxFrenzy() {
    tone(300, 0.45, "sawtooth", 0.04, 0, 1300);
    tone(600, 0.45, "square", 0.03, 0.03, 1800);
    tone(1567.98, 0.2, "triangle", 0.05, 0.2);
    tone(2093, 0.3, "triangle", 0.045, 0.32);
    noise(0.35, 0.03, 0.15, 5000);
  }
  /* 狂熱結束：下滑 */
  function sfxFrenzyEnd() {
    tone(900, 0.18, "square", 0.035, 0, 300);
  }

  /* ================= 儲存 ================= */
  function save() {
    state.ts = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (!s || typeof s.total !== "number") return;
      state.total = s.total || 0;
      state.clicks = s.clicks || 0;
      state.gens = (s.gens && s.gens.length === GENERATORS.length) ? s.gens : GENERATORS.map(function () { return 0; });
      state.clickMult = s.clickMult || 0;
      state.ach = s.ach || {};
      state.sound = s.sound !== false;
      state.slack = s.slack || 0;
      state.frenzies = s.frenzies || 0;
      if (s.ts && typeof s.ts === "number") {
        var away = (Date.now() - s.ts) / 1000;
        var cap = 8 * 3600;
        if (away > 60) {
          var gain = Math.min(away, cap) * baseRate();
          if (gain > 0.5) {
            state.total += gain;
            queueBanner("你不在的期間", "時間又偷偷浪費了 " + humanize(gain));
          }
        }
      }
    } catch (e) { /* corrupted save ignored */ }
  }

  /* ================= 日誌與成就 ================= */
  function logLine(text, isAch) {
    var d = new Date();
    var t = d.toTimeString().slice(0, 8);
    var div = document.createElement("div");
    div.className = "log-item" + (isAch ? " ach" : "");
    var spanT = document.createElement("span");
    spanT.className = "t";
    spanT.textContent = t;
    var spanM = document.createElement("span");
    spanM.textContent = text;
    div.appendChild(spanT); div.appendChild(spanM);
    logListEl.insertBefore(div, logListEl.firstChild);
    while (logListEl.children.length > 60) logListEl.removeChild(logListEl.lastChild);
  }

  function queueBanner(title, msg, gold) {
    bannerQueue.push({ title: title, msg: msg, gold: !!gold });
    if (!bannerTimer) showNextBanner();
  }
  function showNextBanner() {
    var item = bannerQueue.shift();
    if (!item) { bannerTimer = null; return; }
    bannerTitle.textContent = item.title;
    bannerMsg.textContent = item.msg;
    banner.classList.toggle("gold", !!item.gold);
    banner.classList.add("show");
    sfxAch();
    bannerTimer = setTimeout(function () {
      banner.classList.remove("show");
      bannerTimer = setTimeout(showNextBanner, 350);
    }, 2600);
  }

  function checkAchievements() {
    var rate = baseRate();
    var sessionSec = (Date.now() - sessionStart) / 1000;
    var unlocked = 0;
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var a = ACHIEVEMENTS[i];
      if (state.ach[a.id]) { continue; }
      var hit = false;
      switch (a.cond) {
        case "time":    hit = state.total >= a.target; break;
        case "clicks":  hit = state.clicks >= a.target; break;
        case "gens":    hit = gensOwned() >= a.target; break;
        case "rate":    hit = rate >= a.target; break;
        case "session": hit = sessionSec >= a.target; break;
        case "slack":   hit = state.slack >= a.target; break;
        case "frenzy":  hit = state.frenzies >= a.target; break;
      }
      if (hit) {
        state.ach[a.id] = true;
        unlocked++;
        logLine("成就解鎖：" + a.title + "（" + a.msg + "）", true);
        queueBanner(a.title, a.msg);
      }
    }
    if (unlocked) save();
  }

  /* ================= 升級介面 ================= */
  function buildGens() {
    genListEl.innerHTML = "";
    GENERATORS.forEach(function (g, idx) {
      var row = document.createElement("div");
      row.className = "gen";

      var main = document.createElement("div");
      main.className = "g-main";
      var name = document.createElement("div");
      name.className = "g-name";
      name.appendChild(document.createTextNode(g.name));
      var count = document.createElement("span");
      count.className = "count";
      count.id = "gcnt-" + idx;
      count.textContent = "×0";
      name.appendChild(count);
      var desc = document.createElement("div");
      desc.className = "g-desc";
      desc.textContent = g.desc;
      var rate = document.createElement("div");
      rate.className = "g-rate";
      rate.id = "grate-" + idx;
      rate.textContent = "+" + g.rate + " 秒/秒";
      main.appendChild(name); main.appendChild(desc); main.appendChild(rate);

      var buy = document.createElement("button");
      buy.className = "buy";
      buy.type = "button";
      buy.dataset.buy = "gen:" + idx;
      buy.innerHTML = "花費 <span id=\"gcost-" + idx + "\"></span>";
      buy.addEventListener("click", function () { buyGen(idx); });

      row.appendChild(main); row.appendChild(buy);
      genListEl.appendChild(row);
    });
  }

  function buyGen(idx) {
    var c = genCost(idx);
    if (state.total < c) return;
    state.total -= c;
    state.gens[idx]++;
    sfxBuy();
    flashBuy('[data-buy="gen:' + idx + '"]');
    logLine("購買「" + GENERATORS[idx].name + "」（等級 " + state.gens[idx] + "）");
    save();
    render();
  }
  function buyClickMult() {
    var c = clickMultCost();
    if (state.total < c) return;
    state.total -= c;
    state.clickMult++;
    sfxBuy();
    flashBuy('[data-buy="clickMult"]');
    logLine("升級「點擊加倍」至 ×" + Math.pow(2, state.clickMult));
    save();
    render();
  }
  function flashBuy(sel) {
    var b = document.querySelector(sel);
    if (!b) return;
    b.classList.remove("flash");
    void b.offsetWidth;
    b.classList.add("flash");
  }

  /* ================= 點擊：爽度核心 ================= */
  function onClockClick(e) {
    ensureAudio();
    var gain = clickPower();
    state.total += gain;
    state.clicks++;
    sfxTick();

    /* Q 彈擠壓 */
    clockBtn.classList.remove("squash");
    void clockBtn.offsetWidth;
    clockBtn.classList.add("squash");

    /* 霓虹光暈閃爍 */
    clockBtn.classList.remove("hot");
    void clockBtn.offsetWidth;
    clockBtn.classList.add("hot");

    /* 點擊位置漣漪 */
    var rect = clockBtn.getBoundingClientRect();
    var x = (e.clientX || rect.left + rect.width / 2) - rect.left;
    var y = (e.clientY || rect.top + rect.height / 2) - rect.top;
    var rip = document.createElement("span");
    rip.className = "ripple";
    var size = Math.max(rect.width * 0.42, 60);
    rip.style.left = x + "px";
    rip.style.top = y + "px";
    rip.style.width = size + "px";
    rip.style.height = size + "px";
    floatiesEl.appendChild(rip);
    setTimeout(function () { if (rip.parentNode) rip.parentNode.removeChild(rip); }, 600);

    /* 隨機角度飄字 */
    var f = document.createElement("span");
    f.className = "floaty";
    f.textContent = fmtGain(gain);
    f.style.setProperty("--dx", rand(-46, 46).toFixed(0) + "px");
    f.style.setProperty("--rot", rand(-20, 20).toFixed(1) + "deg");
    f.style.setProperty("--drop", rand(60, 95).toFixed(0) + "px");
    f.style.marginLeft = rand(-30, 30).toFixed(0) + "px";
    floatiesEl.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 900);

    /* 數字大彈跳（僅點擊時） */
    totalEl.classList.remove("bigpop");
    void totalEl.offsetWidth;
    totalEl.classList.add("bigpop");

    /* 控制飄字數量 */
    while (floatiesEl.children.length > 14) floatiesEl.removeChild(floatiesEl.firstChild);

    save();
    render();
  }

  /* ================= 摸魚氣泡與狂熱 ================= */
  function scheduleSlack(first) {
    var lo = first ? SLACK_FIRST_MIN : SLACK_MIN;
    var hi = first ? SLACK_FIRST_MAX : SLACK_MAX;
    slackTimer = setTimeout(spawnSlack, rand(lo, hi));
  }
  function spawnSlack() {
    if (slackBubble || document.hidden) { scheduleSlack(false); return; }
    var b = document.createElement("div");
    b.className = "slack-bubble";
    b.innerHTML =
      '<span class="b-orb"></span>' +
      '<span class="b-label">摸魚</span>' +
      '<span class="b-hint">點我：7 倍狂熱 ×5 秒</span>';
    b.style.left = rand(4, 78).toFixed(1) + "vw";
    b.style.top = rand(14, 76).toFixed(1) + "vh";
    b.addEventListener("click", function (ev) {
      ev.stopPropagation();
      triggerFrenzy();
      dismissSlack(true);
    });
    document.body.appendChild(b);
    slackBubble = b;
    sfxSlack();
    slackTtlTimer = setTimeout(function () { dismissSlack(false); }, SLACK_TTL);
  }
  function dismissSlack(hit) {
    if (!slackBubble) return;
    var b = slackBubble;
    slackBubble = null;
    clearTimeout(slackTtlTimer);
    b.classList.add("dying");
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 450);
    scheduleSlack(false);
    if (hit) logLine("摸到一顆靈光一閃。");
  }
  function triggerFrenzy() {
    ensureAudio();
    frenzy = { endAt: Date.now() + FRENZY_DUR };
    state.frenzies++;
    document.body.classList.add("frenzy");
    frenzyChip.classList.add("show");
    sfxFrenzy();
    queueBanner("摸魚成功！", "7 倍浪費狂熱，維持 5 秒！", true);
    logLine("狂熱啟動：7 倍浪費 × 5 秒。");
    checkAchievements();
    save();
  }
  function endFrenzy() {
    frenzy = null;
    document.body.classList.remove("frenzy");
    frenzyChip.classList.remove("show");
    sfxFrenzyEnd();
    logLine("狂熱結束。時間恢復正常流速。");
  }

  /* ================= 渲染 ================= */
  var lastShownTotal = "";
  function render() {
    var rate = totalRate();
    var shown = humanize(state.total);
    totalEl.innerHTML = shown + "<small> 已浪費</small>";
    /* 數值變化時微彈跳 */
    if (shown !== lastShownTotal) {
      totalEl.classList.remove("tick");
      void totalEl.offsetWidth;
      totalEl.classList.add("tick");
      lastShownTotal = shown;
    }
    rateEl.textContent = humanize(rate);
    clickEl.textContent = humanize(clickPower());
    chipClicks.textContent = state.clicks.toLocaleString("zh-Hant");
    var gensTotal = GENERATORS.length + 1;
    var gensOwnedTotal = gensOwned() + (state.clickMult > 0 ? 1 : 0);
    chipGens.textContent = gensOwnedTotal + " / " + gensTotal;
    var achCount = 0;
    for (var k in state.ach) if (state.ach[k]) achCount++;
    chipAch.textContent = achCount;
    statSession.textContent = humanize((Date.now() - sessionStart) / 1000);
    statClicks.textContent = state.clicks.toLocaleString("zh-Hant");
    statRate.textContent = humanize(rate);

    /* 點擊加倍 */
    var cmCost = clickMultCost();
    var cmBtn = document.querySelector('[data-buy="clickMult"]');
    cmBtn.disabled = state.total < cmCost;
    cmBtn.querySelector("span").textContent = fmtCost(cmCost);
    $("clickMultCount").textContent = "×" + Math.pow(2, state.clickMult);
    $("clickMultRate").textContent = "目前每次 +" + humanize(clickPower());

    /* 升級列 */
    for (var i = 0; i < GENERATORS.length; i++) {
      var c = genCost(i);
      var b = document.querySelector('[data-buy="gen:' + i + '"]');
      b.disabled = state.total < c;
      b.querySelector("span").textContent = fmtCost(c);
      var cnt = $("gcnt-" + i);
      cnt.textContent = "×" + state.gens[i];
      cnt.classList.toggle("hot", state.gens[i] > 0);
      $("grate-" + i).textContent = "+" + humanize(GENERATORS[i].rate * state.gens[i]) + "/秒";
    }
  }

  /* ================= 主迴圈 ================= */
  function tick() {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    var rate = totalRate();
    if (rate > 0) {
      state.total += rate * dt;
      save();
      render();
      checkAchievements();
    } else {
      render();
    }
    /* 狂熱到期 */
    if (frenzy && now >= frenzy.endAt) endFrenzy();
  }

  /* ================= 指針：CPS 聯動 ================= */
  var secDeg = 0, minDeg = 0, hourDeg = 0;
  var lastFrame = null;
  function handLoop(now) {
    requestAnimationFrame(handLoop);
    if (lastFrame === null) { lastFrame = now; return; }
    var dt = Math.min((now - lastFrame) / 1000, 0.2);
    lastFrame = now;

    var rate = totalRate();
    /* 指針速度 = f(CPS)，越快越瘋狂，上限 880°/s */
    var spd = Math.min(rate * 0.55, 880);
    if (spd > 0) {
      secDeg = (secDeg + dt * spd) % 360;
      minDeg = (minDeg + dt * spd / 60) % 360;
      hourDeg = (hourDeg + dt * spd / 720) % 360;
      secHand.setAttribute("transform", "rotate(" + secDeg + " 50 50)");
      minHand.setAttribute("transform", "rotate(" + minDeg + " 50 50)");
      hourHand.setAttribute("transform", "rotate(" + hourDeg + " 50 50)");
    }
    /* 高速模糊 */
    hands.classList.toggle("fast", spd > 220);
    hands.classList.toggle("blur", spd > 520);

    /* 狂熱倒數 */
    if (frenzy) {
      var remain = Math.max(0, (frenzy.endAt - Date.now()) / 1000);
      frenzyCount.textContent = remain.toFixed(1) + "s";
    }
  }

  /* ================= 事件 ================= */
  clockBtn.addEventListener("click", onClockClick);

  soundBtn.addEventListener("click", function () {
    ensureAudio();
    state.sound = !state.sound;
    soundBtn.textContent = state.sound ? "音效：開" : "音效：關";
    save();
    tone(500, 0.06, "square", 0.05);
  });

  resetBtn.addEventListener("click", function () { overlay.classList.add("show"); });
  $("cancelReset").addEventListener("click", function () { overlay.classList.remove("show"); });
  $("confirmReset").addEventListener("click", function () {
    overlay.classList.remove("show");
    state.total = 0; state.clicks = 0;
    state.gens = GENERATORS.map(function () { return 0; });
    state.clickMult = 0;
    state.ach = {};
    state.slack = 0;
    state.frenzies = 0;
    if (frenzy) endFrenzy();
    clearTimeout(slackTimer);
    if (slackBubble) { var b = slackBubble; slackBubble = null; clearTimeout(slackTtlTimer); b.remove(); }
    logLine("進度已重置。一切從零開始浪費。");
    save();
    render();
    scheduleSlack(true);
  });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.classList.remove("show"); });

  document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });
  window.addEventListener("beforeunload", save);

  /* ================= 啟動 ================= */
  load();
  soundBtn.textContent = state.sound ? "音效：開" : "音效：關";
  buildGens();
  render();
  logLine("遊戲載入。開始浪費時間吧。");
  checkAchievements();
  lastTick = Date.now();
  setInterval(tick, 100);
  requestAnimationFrame(handLoop);
  scheduleSlack(true);
})();
</script>
</body>
</html>
